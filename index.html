<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#F6D86B" />
  <title>One Line a Day</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div>
        <div class="eyebrow" id="todayLabel"></div>
        <h1 id="appTitle">One Line a Day</h1>
      </div>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings">⚙︎</button>
    </header>

    <main>
      <section id="todayView" class="view active">
        <div class="hero card">
          <div class="date-block">
            <div class="big-date" id="bigDate"></div>
            <div class="sub-date" id="subDate"></div>
          </div>
          <div class="streak" id="streakText"></div>
        </div>

        <div id="blocksContainer"></div>

        <button class="secondary-btn add-block-btn" id="addBlockBtn">
          <span>＋</span>
          <span data-i18n="addBlock">新增记录区块</span>
        </button>

        <button class="primary-btn" id="saveBtn" data-i18n="saveToday">保存今天</button>
        <div id="saveHint" class="save-hint"></div>
      </section>

      <section id="calendarView" class="view">
        <div class="calendar-head">
          <button class="icon-btn" id="prevMonth">‹</button>
          <select class="month-select" id="calendarMonthSelect" aria-label="Select month"></select>
          <button class="icon-btn" id="nextMonth">›</button>
        </div>
        <div class="weekday-row" id="weekdayRow"></div>
        <div class="calendar-grid" id="calendarGrid"></div>
        <div class="legend">
          <span><i class="legend-dot mine-dot"></i><span data-i18n="myDay">我的一天</span></span>
          <span><i class="legend-dot xixi-dot"></i><span data-i18n="xixiDay">熹熹的一天</span></span>
        </div>
      </section>

      <section id="yearView" class="view">
        <div class="year-head">
          <button class="icon-btn" id="prevYear">‹</button>
          <h2 id="yearTitle"></h2>
          <button class="icon-btn" id="nextYear">›</button>
        </div>
        <div class="jump-row">
          <span data-i18n="jumpToMonth">跳转月份</span>
          <select class="month-select" id="yearMonthSelect" aria-label="Jump to month"></select>
        </div>
        <div class="segmented">
          <button data-year-filter="both" class="active" data-i18n="both">全部</button>
          <button data-year-filter="mine" data-i18n="myDay">我的一天</button>
          <button data-year-filter="xixi" data-i18n="xixiDay">熹熹的一天</button>
        </div>
        <div class="card ai-batch-card">
          <div class="section-title-row"><div><span class="dot" style="background:var(--lilac)"></span><h2 data-i18n="batchAi">批量 AI 整理</h2></div></div>
          <div class="batch-grid">
            <label><span data-i18n="batchBlock">处理区块</span><select id="batchBlockSelect"><option value="mine" data-i18n="myDay">我的一天</option><option value="xixi" data-i18n="xixiDay">熹熹的一天</option><option value="all" data-i18n="allBlocks">全部区块</option></select></label>
            <label><span data-i18n="batchRange">范围</span><select id="batchRangeSelect"><option value="year" data-i18n="thisYear">当前年份</option><option value="month" data-i18n="currentMonth">当前月份</option><option value="all" data-i18n="allRecords">全部记录</option></select></label>
          </div>
          <label class="setting-row"><span data-i18n="onlyUnprocessed">仅处理尚未 AI 整理的记录</span><input id="onlyUnprocessed" type="checkbox" checked></label>
          <div class="batch-actions"><button class="secondary-btn" id="previewBatchBtn" data-i18n="previewFirst10">预览前 10 条</button><button class="primary-btn" id="runBatchBtn" data-i18n="runBatch">开始批量整理</button></div>
          <div id="batchSummary" class="muted tiny"></div><div id="batchProgress" class="save-hint"></div>
        </div>
        <div id="batchPreview" class="batch-preview"></div>

        <div id="yearMonths" class="year-months"></div>
      </section>

      <section id="reviewView" class="view">
        <div class="review-card card">
          <h2 data-i18n="onThisDay">往年今日</h2>
          <p class="muted" data-i18n="reviewDesc">这里会显示去年、前年同一天留下的一句话。</p>
          <div id="reviewList"></div>
        </div>

        <div class="card search-card">
          <h2 data-i18n="search">搜索</h2>
          <input id="searchInput" type="search" data-i18n-placeholder="searchPlaceholder" placeholder="搜索关键词或标签" />
          <div class="segmented small">
            <button data-search-filter="both" class="active" data-i18n="both">全部</button>
            <button data-search-filter="mine" data-i18n="mineShort">我</button>
            <button data-search-filter="xixi" data-i18n="xixiShort">熹熹</button>
          </div>
          <div id="searchResults"></div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <button data-view="todayView" class="active"><span>●</span><small data-i18n="today">今天</small></button>
      <button data-view="calendarView"><span>▦</span><small data-i18n="calendar">日历</small></button>
      <button data-view="yearView"><span>▥</span><small data-i18n="year">全年</small></button>
      <button data-view="reviewView"><span>⌕</span><small data-i18n="review">回顾</small></button>
    </nav>
  </div>

  <dialog id="entryDialog">
    <div class="dialog-inner">
      <div class="dialog-head">
        <div>
          <div class="eyebrow" id="dialogDate"></div>
          <h2 data-i18n="editDay">编辑这一天</h2>
        </div>
        <button class="icon-btn" id="closeDialog">×</button>
      </div>
      <div id="dialogBlocksContainer"></div>
      <button class="secondary-btn add-block-btn" id="dialogAddBlockBtn">
        <span>＋</span>
        <span data-i18n="addBlock">新增记录区块</span>
      </button>
      <button class="primary-btn" id="dialogSave" data-i18n="save">保存</button>
    </div>
  </dialog>

  <dialog id="blockPickerDialog">
    <div class="dialog-inner">
      <div class="dialog-head">
        <div>
          <div class="eyebrow" data-i18n="chooseBlock">选择记录区块</div>
          <h2 data-i18n="addBlock">新增记录区块</h2>
        </div>
        <button class="icon-btn" id="closeBlockPicker">×</button>
      </div>
      <div id="blockPresetList" class="preset-picker-list"></div>
      <button class="secondary-btn" id="customBlockBtn" data-i18n="customBlock">自定义标题</button>
    </div>
  </dialog>

  <dialog id="settingsDialog">
    <div class="dialog-inner">
      <div class="dialog-head">
        <h2 data-i18n="settings">设置</h2>
        <button class="icon-btn" id="closeSettings">×</button>
      </div>
      <label class="setting-row">
        <span data-i18n="language">语言</span>
        <select id="languageSelect">
          <option value="system">跟随系统 / System</option>
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
      </label>
      <label class="setting-row">
        <span data-i18n="appearance">外观</span>
        <select id="themeSelect">
          <option value="system">跟随系统 / System</option>
          <option value="light">浅色 / Light</option>
          <option value="dark">深色 / Dark</option>
        </select>
      </label>
      <label class="setting-row">
        <span data-i18n="colorTheme">配色主题</span>
        <select id="paletteSelect">
          <option value="minimal">极简黑白 / Minimal</option>
          <option value="macaron">马卡龙 / Macaron</option>
          <option value="dopamine">多巴胺 / Dopamine</option>
          <option value="cream">奶油手账 / Cream Journal</option>
          <option value="morandi">莫兰迪 / Morandi</option>
        </select>
      </label>
      <div class="settings-section">
        <div class="settings-section-head">
          <div>
            <div class="eyebrow" data-i18n="aiSettings">AI 设置</div>
            <p class="muted tiny" data-i18n="aiSettingsDesc">可更换 Provider，无需重新修改 App。</p>
          </div>
        </div>
        <label class="setting-stack"><span data-i18n="providerName">Provider 名称</span><input id="aiProviderName" placeholder="OpenAI / OpenRouter / Other"></label>
        <label class="setting-stack"><span data-i18n="endpoint">API Endpoint</span><input id="aiEndpoint" placeholder="https://api.example.com/v1/chat/completions"></label>
        <label class="setting-stack"><span data-i18n="modelName">模型</span><input id="aiModel" placeholder="model-name"></label>
        <label class="setting-stack"><span data-i18n="apiKey">API Key</span><input id="aiApiKey" type="password" placeholder="sk-..."></label>
        <label class="setting-stack"><span data-i18n="aiStyle">整理风格</span><select id="aiStyle">
          <option value="faithful" data-i18n="styleFaithful">忠实精简</option>
          <option value="natural" data-i18n="styleNatural">自然日记</option>
          <option value="short" data-i18n="styleShort">超短一句</option>
        </select></label>
        <button class="secondary-btn" id="testAiBtn" data-i18n="testAi">测试 AI 连接</button>
        <div id="aiTestStatus" class="save-hint"></div>
      </div>
      <hr>

      <div class="settings-section">
        <div class="settings-section-head">
          <div>
            <div class="eyebrow" data-i18n="blockPresets">常用区块标题</div>
            <p class="muted tiny" data-i18n="blockPresetsDesc">新增记录时直接选择，不用每天重新输入标题。</p>
          </div>
        </div>
        <div id="presetSettingsList" class="preset-settings-list"></div>
        <div class="preset-add-row">
          <input id="newPresetInput" maxlength="30" data-i18n-placeholder="presetPlaceholder" placeholder="例如：熹熹的一天">
          <button class="mini-btn" id="addPresetBtn" data-i18n="add">添加</button>
        </div>
      </div>
      <hr>
      <button class="secondary-btn" id="exportBtn" data-i18n="exportBackup">导出完整备份</button>
      <label class="secondary-btn file-btn">
        <span data-i18n="importBackup">导入完整备份</span>
        <input id="importInput" type="file" accept="application/json" hidden>
      </label>
      <p class="muted tiny" data-i18n="localOnly">当前版本数据保存在本机浏览器中。</p>
    </div>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
